name: A96 Windows validation

on:
  push:
    branches:
      - fix/a96-deployment-fail-closed
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/a96-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend build
        run: npm run build:frontend
      - name: Backend and worker build
        run: npm run build:backend
      - name: Native Windows agent build
        shell: powershell
        run: npm run build:agent
      - name: Unit, integration, security and native isolated tests
        run: |
          New-Item -ItemType Directory -Force build/test-results | Out-Null
          npx tsx --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=build/test-results/all-tests.tap backend/__tests__/*.test.ts
      - name: Installer filesystem, ACL, resume and junction acceptance
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/test-results | Out-Null
          & cmd.exe /d /s /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/Installer.Acceptance.ps1 > build\test-results\installer.txt 2>&1"
          $result=$LASTEXITCODE
          Get-Content build/test-results/installer.txt
          if($result -ne 0){exit $result}
          & cmd.exe /d /s /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/Iis.Policy.Tests.ps1 > build\test-results\iis-policy.txt 2>&1"
          $result=$LASTEXITCODE
          Get-Content build/test-results/iis-policy.txt
          if($result -ne 0){exit $result}
      - name: Verify built artifacts
        shell: pwsh
        run: |
          $required = @(
            'dist-backend/sam-att-gateway.cjs',
            'dist-backend/sam-att-host.cjs',
            'build/agent/deployment-agent-worker.cjs',
            'build/agent/SamAttDeploymentAgent.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing build artifact: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            Write-Host "$file SHA256=$hash"
          }
      - name: Validate A98 PowerShell scripts parse on Windows
        shell: pwsh
        run: |
          $files = @('scripts/Export-A98BaselineEvidence.ps1', 'scripts/Assert-A99MaintenanceApproval.ps1', 'scripts/Invoke-A99WindowsPreflight.ps1', 'scripts/Test-A96ProductionIntegrationReadiness.ps1', 'scripts/install-deployment-agent-service.ps1', 'scripts/install-deployment-center-once.ps1', 'scripts/DeploymentInstallSafety.ps1', 'scripts/provision-deployment-center-iis.ps1', 'scripts/Test-DeploymentCenterHttpIsolation.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parser failed: $file : $($errors -join '; ')" }
            Write-Host "PARSE PASS: $file"
          }
      - name: Package verified CI artifacts (not a production approval)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/a98-release-candidate | Out-Null
          $files = @(
            'dist-backend/sam-att-gateway.cjs',
            'dist-backend/sam-att-host.cjs',
            'build/agent/deployment-agent-worker.cjs',
            'build/agent/SamAttDeploymentAgent.exe',
            'scripts/install-deployment-agent-service.ps1',
            'scripts/Export-A98BaselineEvidence.ps1',
            'scripts/Invoke-A99WindowsPreflight.ps1'
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath build/a98-release-candidate/SHA256SUMS.txt -Encoding utf8
          Copy-Item -LiteralPath dist-backend/sam-att-gateway.cjs -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath dist-backend/sam-att-host.cjs -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath build/agent/deployment-agent-worker.cjs -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath build/agent/SamAttDeploymentAgent.exe -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath scripts/install-deployment-agent-service.ps1 -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath scripts/Export-A98BaselineEvidence.ps1 -Destination build/a98-release-candidate/
          Copy-Item -LiteralPath scripts/Invoke-A99WindowsPreflight.ps1 -Destination build/a98-release-candidate/
          @(
            "SourceCommit=${{ github.event.pull_request.head.sha || github.sha }}"
            "SourceRef=$env:GITHUB_REF"
            'ApprovalStatus=NOT_APPROVED_FOR_PRODUCTION'
            'BaselineStatus=UNVERIFIED'
          ) | Set-Content -LiteralPath build/a98-release-candidate/RELEASE-STATUS.txt -Encoding utf8
      - name: Upload A98 release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: a98-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/a98-release-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a96-windows-test-results
          path: build/test-results/
          if-no-files-found: error
